[package]
name = "orient-orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.34"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.27.0", features = ["v4"] }

axum = { version = "0.8.9", features = ["multipart"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls"] }
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }


[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
