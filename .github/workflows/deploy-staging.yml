# Manual staging release to Cloud Run. Actions > Deploy staging > Run workflow, pick a branch or tag.
# One-time GCP and GitHub setup: README.md, "Staging on Cloud Run".
name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      fakes:
        description: Use the fake navigation engine and STT (off = NAV_URL and STT_URL from the staging environment)
        type: boolean
        default: true

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      REGION: ${{ vars.GCP_REGION }}
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/orient/orient-orchestrator:${{ github.sha }}
      # Optional: name of a Secret Manager secret holding the TypeSafe key.
      SECRETS: ${{ vars.TYPESAFE_SECRET && format('--set-secrets=TYPESAFE_API_KEY={0}:latest', vars.TYPESAFE_SECRET) || '' }}
    steps:
      - name: Check staging variables
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
          GCP_RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
        run: |
          missing=""
          for v in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_DEPLOY_SA GCP_RUNTIME_SA; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "::error::Missing variables in the 'staging' environment:$missing (Settings > Environments > staging > Variables, not Secrets). See README.md, Staging on Cloud Run."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy fakes
        if: inputs.fakes
        run: |
          # One instance: the navigation preset lives in memory.
          gcloud run deploy orient-fakes-staging --image "$IMAGE" --region "$REGION" --command fakes \
            --service-account "$RUNTIME_SA" --allow-unauthenticated --max-instances 1 --quiet
          echo "FAKES_URL=$(gcloud run services describe orient-fakes-staging --region "$REGION" --format 'value(status.url)')" >> "$GITHUB_ENV"

      - name: Deploy orchestrator
        env:
          FAKES: ${{ inputs.fakes }}
          REAL_NAV_URL: ${{ vars.NAV_URL }}
          REAL_STT_URL: ${{ vars.STT_URL }}
          ALLOW_ORIGINS: ${{ vars.ALLOW_ORIGINS || '*' }}
        run: |
          if [ "$FAKES" = "true" ]; then NAV_URL="$FAKES_URL"; STT_URL="$FAKES_URL/stt"; else NAV_URL="$REAL_NAV_URL"; STT_URL="$REAL_STT_URL"; fi
          # Clients live in memory: one instance, CPU kept between requests for the frame worker,
          # and a long timeout so the SSE stream is not cut.
          gcloud run deploy orient-orchestrator-staging --image "$IMAGE" --region "$REGION" \
            --service-account "$RUNTIME_SA" --allow-unauthenticated --max-instances 1 --min-instances 0 --no-cpu-throttling --timeout 3600 \
            --set-env-vars "^@^NAV_URL=$NAV_URL@STT_URL=$STT_URL@DEBUG_PAGE=1@TRACE_STDOUT=1@GIT_SHA=$GITHUB_SHA@ALLOW_ORIGINS=$ALLOW_ORIGINS" \
            $SECRETS --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe orient-orchestrator-staging --region "$REGION" --format 'value(status.url)')
          curl -fsS "$URL/v1/health" | tee /dev/stderr | grep -q "\"commit\":\"$GITHUB_SHA\""
          echo "Staging: $URL (debug page: $URL/debug)" >> "$GITHUB_STEP_SUMMARY"
